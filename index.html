<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NM Assistência - Gestão de Serviços</title>
    <style>
        /* --- Variáveis e Reset --- */
        :root {
            --primary-color: #002060; /* Azul Escuro */
            --secondary-color: #000000; /* Preto */
            --bg-color: #f4f6f9; /* Fundo claro */
            --white: #ffffff;
            --text-color: #333333;
            --border-radius: 10px;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        header {
            background: linear-gradient(135deg, var(--primary-color), #001540);
            color: var(--white);
            padding: 1.8rem 1rem;
            text-align: center;
            box-shadow: var(--shadow);
        }

        header h1 {
            font-size: 1.9rem;
            font-weight: 600;
        }

        header p {
            margin-top: 0.3rem;
            opacity: 0.9;
        }

        /* --- Layout Principal --- */
        main {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 768px) {
            main {
                grid-template-columns: 1fr 2fr;
            }
        }

        /* --- Card --- */
        .card {
            background-color: var(--white);
            border-radius: var(--border-radius);
            padding: 1.8rem;
            box-shadow: var(--shadow);
            border-top: 5px solid var(--primary-color);
        }

        h2 {
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            font-size: 1.4rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.5rem;
        }

        /* --- Formulário --- */
        .form-group {
            margin-bottom: 1.1rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 0.8rem 0.9rem;
            border: 1px solid #ccc;
            border-radius: var(--border-radius);
            font-size: 0.95rem;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button.btn-save {
            width: 100%;
            padding: 1rem;
            margin-top: 0.5rem;
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button.btn-save:hover {
            background-color: #001540;
        }

        /* --- Tabela --- */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        thead {
            background-color: var(--secondary-color);
            color: var(--white);
        }

        th, td {
            padding: 0.9rem;
            border-bottom: 1px solid #eee;
            vertical-align: top;
        }

        tr:hover {
            background-color: #f5f7fa;
        }

        .money {
            font-weight: bold;
            color: var(--primary-color);
        }

        .btn-delete {
            background-color: #e74c3c;
            color: #fff;
            border: none;
            padding: 0.45rem 0.7rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* --- Footer --- */
        footer {
            background-color: var(--secondary-color);
            color: var(--white);
            text-align: center;
            padding: 1rem;
            font-size: 0.85rem;
        }
    </style>

    <!-- GSAP -->
    <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
</head>
<body>

<header>
    <h1>NM Assistência</h1>
    <p>Sistema de Gestão de Serviços</p>
</header>

<main>
    <section class="card">
        <h2>Novo Serviço</h2>
        <form id="serviceForm">
            <div class="form-group">
                <label>Nome do Cliente</label>
                <input type="text" id="clienteNome" required>
            </div>

            <div class="form-group">
                <label>Telefone</label>
                <input type="tel" id="clienteTelefone" required>
            </div>

            <div class="form-group">
                <label>Endereço</label>
                <input type="text" id="clienteEndereco">
            </div>

            <div class="form-group">
                <label>Serviço Realizado</label>
                <input type="text" id="servicoDesc" required>
            </div>

            <div class="form-group">
                <label>Data e Hora</label>
                <input type="datetime-local" id="dataServico" required>
            </div>

            <div class="form-group">
                <label>Valor (R$)</label>
                <input type="number" id="valorPagamento" step="0.01" required>
            </div>

            <div class="form-group">
                <label>Observação</label>
                <textarea id="observacao" rows="3"></textarea>
            </div>

            <button class="btn-save" type="submit">Registrar Serviço</button>
        </form>
    </section>

    <section class="card">
        <h2>Histórico de Serviços</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Cliente</th>
                        <th>Serviço</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaServicos"></tbody>
            </table>
        </div>
        <p id="emptyMsg" style="text-align:center;margin-top:15px;color:#777">Nenhum serviço registrado.</p>
    </section>
</main>

<footer>
    © 2026 NM Assistência - Todos os direitos reservados
</footer>

<script>
    // --- Animações GSAP ---
    document.addEventListener('DOMContentLoaded', () => {
        gsap.from('header', {
            y: -80,
            opacity: 0,
            duration: 1,
            ease: 'power3.out'
        });

        gsap.from('.card', {
            opacity: 0,
            y: 40,
            duration: 0.8,
            stagger: 0.2,
            ease: 'power2.out'
        });

        gsap.from('footer', {
            opacity: 0,
            duration: 1,
            delay: 0.6
        });
    });


    const form = document.getElementById('serviceForm');
    const tabela = document.getElementById('tabelaServicos');
    const emptyMsg = document.getElementById('emptyMsg');

    document.addEventListener('DOMContentLoaded', load);

    form.addEventListener('submit', e => {
        e.preventDefault();
        const servicos = JSON.parse(localStorage.getItem('nm_servicos')) || [];

        servicos.push({
            id: Date.now(),
            nome: clienteNome.value,
            telefone: clienteTelefone.value,
            endereco: clienteEndereco.value,
            desc: servicoDesc.value,
            data: dataServico.value,
            valor: Number(valorPagamento.value),
            obs: observacao.value
        });

        localStorage.setItem('nm_servicos', JSON.stringify(servicos));
        form.reset();
        load();
    });

    function load() {
        const servicos = JSON.parse(localStorage.getItem('nm_servicos')) || [];
        tabela.innerHTML = '';

        if (!servicos.length) {
            emptyMsg.style.display = 'block';
            return;
        }

        emptyMsg.style.display = 'none';

        servicos.sort((a,b)=> new Date(b.data)-new Date(a.data));

        servicos.forEach(s => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${new Date(s.data).toLocaleString('pt-BR')}</td>
                <td>${s.nome}<br><small>${s.telefone}</small></td>
                <td>${s.desc}<br><small>${s.obs || ''}</small></td>
                <td class="money">${s.valor.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</td>
                <td><button class="btn-delete" onclick="del(${s.id})">Excluir</button></td>
            `;
            tabela.appendChild(tr);
        });
    }

    window.del = id => {
        let servicos = JSON.parse(localStorage.getItem('nm_servicos')) || [];
        servicos = servicos.filter(s => s.id !== id);
        localStorage.setItem('nm_servicos', JSON.stringify(servicos));
        load();
    }
</script>
</body>
</html>
